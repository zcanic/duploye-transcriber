<script>
  // Tell the page transition which way we are going (canvas <-> lessons), before the first frame.
  addEventListener('pagereveal', (e) => {
    if (!e.viewTransition) return;
    e.viewTransition.types.add(/(learn|cards)\.html$/.test(location.pathname) ? 'to-lessons' : 'to-canvas');
    e.viewTransition.ready.catch(() => {}); // an interrupted transition is not an error
    window.__pageReveal = e.viewTransition.finished.catch(() => {}); // heavy work waits for this
  });
</script>
<link rel="expect" href="#lessons" blocking="render">
