<main class="room">
  <div class="meter"><span id="score" class="score" aria-live="polite"></span></div>

  <section class="sheet" id="sheet" aria-live="polite">
    <div class="wash" aria-hidden="true"></div>
    <div class="body" id="body">
      <svg class="steno" id="steno" aria-hidden="true"><g></g></svg>
      <div class="prompt" id="prompt"></div>
      <div class="sub" id="sub"></div>
      <div class="answer" id="answer" lang="fr"></div>
    </div>
  </section>

  <form class="ask" id="ask" autocomplete="off">
    <input id="guess" type="text" lang="fr" inputmode="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false"
      aria-label="The French, accents optional">
    <button type="submit" id="go" class="go" aria-label="Check"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="enter" d="M15 5v4.5a2 2 0 0 1-2 2H5m3-3.2L4.8 11.5 8 14.7"/><path class="next" d="M4.5 10h11m-4-4 4 4-4 4"/></svg></button>
  </form>
  <div class="note" id="note"></div>
  <div class="foot"><button type="button" class="link-btn" id="reveal">看答案</button><span class="grow"></span><span class="keys">回车 检查 · Esc 看答案</span></div>
</main>
