<body>
<h1 class="vh">Duployé Transcriber: write French and English in Duployé shorthand (sténographie Duployé)</h1>
<div id="stage" aria-label="Shorthand canvas. Drag to pan, scroll or pinch to zoom.">
  <div id="world"><svg id="ink" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Duployé shorthand"></svg></div>
</div>

<header id="bar" class="float">
  <button type="button" class="mark" aria-label="Duployé: pages and links" aria-haspopup="true" aria-expanded="false" aria-controls="siteMenu"><svg class="mark-steno" viewBox="-40 -684 2325 945.8689270019531" aria-hidden="true"><g transform="scale(1,-1)" fill="currentColor"><path d="M85,35C85,16 101,0 120,0L1120,0C1139,0 1155,16 1155,35C1155,54 1139,70 1120,70L120,70C101,70 85,54 85,35Z" transform="translate(0,0)"/><path d="M85,35C85,16 101,0 120,0C305,0 455,150 455,335C455,354 439,370 420,370C401,370 385,354 385,335C385,189 266,70 120,70C101,70 85,54 85,35Z" transform="translate(1000,0)"/><path d="M85,35C85,16 101,0 120,0C139,0 155,16 155,35L155,535C155,554 139,570 120,570C101,570 85,554 85,535L85,35Z" transform="translate(1300,-200)"/><path d="M145,10L645,510C677.1,542.1 626.9,591.9 595,560L95,60C62.9,27.9 113.1,-21.9 145,10Z" transform="translate(1300,-200)"/><path d="M139,116L245,10C277.1,-22.1 326.9,28.1 295,60L189,166C144,211 144,283 189,328C234,373 306,373 351,328C396,283 396,211 351,166C318.9,133.9 369.1,84.1 401,116C473,188 473,306 401,378C329,450 211,450 139,378C67,306 67,188 139,116Z" transform="translate(1544,194)"/><path d="M95,110L166,40C219,-13 304,-13 357,40C389.0,72.0 338.4,120.4 307,89C282,64 240,64 215,89L145,160C112.9,192.1 63.1,141.9 95,110Z" transform="translate(1694,94)"/><path d="M145,152C170,177 212,177 237,152C262,127 262,85 237,60C205.4,28.4 254.2,-21.8 286,10C339,63 339,148 286,201C233,254 148,254 95,201C63.0,169.0 113.6,120.6 145,152Z" transform="translate(1906,-18)"/></g></svg><span class="mark-word">Duployé</span></button>
  <div class="tools" role="toolbar" aria-label="Canvas tools">
    <div class="seg" role="group" aria-label="Language">
      <button class="tool toggle" type="button" data-lang="fr" aria-pressed="true" title="French: Duployé">FR</button>
      <button class="tool toggle" type="button" data-lang="en" aria-pressed="false" title="English: Sloan-Duployan">EN</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button id="replay" class="tool" type="button" title="Write again (R)" aria-label="Write again">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 14.5c3-1 4-9 7-9 2 0 1 5 3 5 1.2 0 2-1 2.5-2"/><path d="M3 17h14" class="faint"/></svg>
      <span class="lbl">Write</span></button>
    <span class="sep" aria-hidden="true"></span>
    <button id="zoomOut" class="tool icon" type="button" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
    <button id="zoomPct" class="tool pct" type="button" title="Fit to screen (0)" aria-label="Fit to screen">100%</button>
    <button id="zoomIn" class="tool icon" type="button" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button id="gloss" class="tool toggle" type="button" aria-pressed="true" title="Show French under each word (G)">Gloss</button>
    <button id="accents" class="tool toggle" type="button" aria-pressed="true" title="Mark open vowels è [ɛ], ò [ɔ], œ [œ] with an accent (house rule, not in the manual)">Accents</button>
    <button id="sigles" class="tool toggle" type="button" aria-pressed="false" title="Shortcuts: sigles, oi written as a, ui written as i">Sigles</button>
    <button id="alpha" class="tool toggle" type="button" aria-pressed="false" title="Alphabet (A)">Alphabet</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="copy" class="tool" type="button" title="Copy as Unicode text">Copy</button>
    <button id="export" class="tool" type="button" title="Download as SVG">SVG</button>
    <span class="sep" aria-hidden="true"></span>
    <a class="tool" href="learn.html" title="Lessons">Lessons</a>
    <a class="tool" href="cards.html" title="Vocabulary cards">Cards</a>

<aside id="drawer" class="float" hidden aria-label="Alphabet">
  <div class="drawer-head"><h2>Alphabet</h2><p id="drawerHint">Select a word, then tap a sign to add it.</p></div>
  <div id="legend"></div>
  <a class="src" href="https://github.com/zcanic/duploye-transcriber" target="_blank" rel="noopener">How it works · source</a>
</aside>

<section id="inspector" class="float" hidden aria-label="Word">
  <div class="insp-head">
    <div><div id="inspWord" class="insp-word"></div><div id="inspNote" class="insp-note"></div></div>
    <button id="inspClose" class="tool icon" type="button" aria-label="Close (Esc)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8"/></svg></button>
  </div>
  <div id="chips" class="chips" aria-label="Sounds"></div>
  <div id="palette" class="palette" hidden></div>
  <div class="insp-foot">
    <button id="inspAdd" class="tool" type="button" aria-expanded="false">+ Sound</button>
    <button id="inspReset" class="tool" type="button">Reset word</button>
  </div>
</section>

<form id="composer" class="float" autocomplete="off">
  <label for="src" class="vh">French text</label>
  <textarea id="src" rows="1" spellcheck="false" placeholder="" data-en-sample="Shorthand is the art of writing as fast as people speak. Practice a little every day, and read your notes aloud.">La loi donne à l'avocat l'arme qu'il faut pour chaque cas. Lorsque la cause est bonne et en accord avec le code, il l'adopte et la gagne.</textarea>
  <div class="composer-meta"><span id="status" aria-live="polite"></span><span class="hint"><kbd>⌘↵</kbd>write again</span></div>
</form>

<div id="toast" role="status" aria-live="polite"></div>
<script>
  // Restore the composer and toggles before the first frame, so nothing jumps when the app boots.
  // Keys and samples mirror src/app.js and src/systems.js.
  (() => {
    const get = (k) => { try { const v = localStorage.getItem(k); return v === null ? null : JSON.parse(v); } catch { return null; } };
    const lang = get('duploye.lang') === 'en' ? 'en' : 'fr';
    const src = document.getElementById('src');
    const text = get('duploye.v2.text.' + lang) ?? (lang === 'fr' ? get('duploye.v2.text') : null);
    if (text !== null) src.value = text; else if (lang === 'en') src.value = src.dataset.enSample;
    for (const b of document.querySelectorAll('[data-lang]')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    if (get('duploye.gloss') === false) document.getElementById('gloss').setAttribute('aria-pressed', 'false');
    if (get('duploye.shortcuts') === true) document.getElementById('sigles').setAttribute('aria-pressed', 'true');
    if (get('duploye.accents') === false) document.getElementById('accents').setAttribute('aria-pressed', 'false');
    document.getElementById('accents').hidden = lang === 'en';
    src.style.height = src.scrollHeight + 'px';
  })();
</script>
<span id="first-frame" hidden></span>

<noscript><p style="padding:24px">This tool needs JavaScript.</p></noscript>
