<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duployé Transcriber</title>
<meta name="description" content="Write French in Duployé shorthand. Type French and watch it written stroke by stroke; every word's sounds are editable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="preload" href="fonts/NotoSansDuployan-Regular.ttf" as="fetch" type="font/ttf" crossorigin>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="stage" aria-label="Shorthand canvas. Drag to pan, scroll or pinch to zoom.">
  <div id="world"><svg id="ink" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Duployé shorthand"></svg></div>
</div>

<header id="bar" class="float">
  <div class="mark"><span class="mark-steno" aria-hidden="true"></span><span class="mark-word"><em>Duployé</em></span></div>
  <div class="tools" role="toolbar" aria-label="Canvas tools">
    <div class="seg" role="group" aria-label="Language">
      <button class="tool toggle" type="button" data-lang="fr" aria-pressed="true" title="French: Duployé">FR</button>
      <button class="tool toggle" type="button" data-lang="en" aria-pressed="false" title="English: Sloan-Duployan">EN</button>
    </div>
    <span class="sep" aria-hidden="true"></span>
    <button id="replay" class="tool" type="button" title="Write again (R)" aria-label="Write again">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 14.5c3-1 4-9 7-9 2 0 1 5 3 5 1.2 0 2-1 2.5-2"/><path d="M3 17h14" class="faint"/></svg>
      <span class="lbl">Write</span></button>
    <span class="sep" aria-hidden="true"></span>
    <button id="zoomOut" class="tool icon" type="button" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg></button>
    <button id="zoomPct" class="tool pct" type="button" title="Fit to screen (0)" aria-label="Fit to screen">100%</button>
    <button id="zoomIn" class="tool icon" type="button" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button id="gloss" class="tool toggle" type="button" aria-pressed="true" title="Show French under each word (G)">Gloss</button>
    <button id="sigles" class="tool toggle" type="button" aria-pressed="true" title="Use abbreviations (sigles)">Sigles</button>
    <button id="alpha" class="tool toggle" type="button" aria-pressed="false" title="Alphabet (A)">Alphabet</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="copy" class="tool" type="button" title="Copy as Unicode text">Copy</button>
    <button id="export" class="tool" type="button" title="Download as SVG">SVG</button>
    <span class="sep" aria-hidden="true"></span>
    <a class="tool" href="learn.html" title="Lessons">Lessons</a>
  </div>
</header>

<aside id="drawer" class="float" hidden aria-label="Alphabet">
  <div class="drawer-head"><h2>Alphabet</h2><p id="drawerHint">Select a word, then tap a sign to add it.</p></div>
  <div id="legend"></div>
  <a class="src" href="https://github.com/zcanic/duploye-transcriber" target="_blank" rel="noopener">How it works · source</a>
</aside>

<section id="inspector" class="float" hidden aria-label="Word">
  <div class="insp-head">
    <div><div id="inspWord" class="insp-word"></div><div id="inspNote" class="insp-note"></div></div>
    <button id="inspClose" class="tool icon" type="button" aria-label="Close (Esc)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8"/></svg></button>
  </div>
  <div id="chips" class="chips" aria-label="Sounds"></div>
  <div id="palette" class="palette" hidden></div>
  <div class="insp-foot">
    <button id="inspAdd" class="tool" type="button" aria-expanded="false">+ Sound</button>
    <button id="inspReset" class="tool" type="button">Reset word</button>
  </div>
</section>

<form id="composer" class="float" autocomplete="off">
  <label for="src" class="vh">French text</label>
  <textarea id="src" rows="1" spellcheck="false" placeholder=""></textarea>
  <div class="composer-meta"><span id="status" aria-live="polite"></span><span class="hint"><kbd>⌘↵</kbd>write again</span></div>
</form>

<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">This tool needs JavaScript.</p></noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
